name: Report a mod
description: Report a listed mod that's broken, harmful, or listed by someone who doesn't own it.
title: "Report: "
labels: ["report"]
body:
  - type: input
    id: mod
    attributes:
      label: Mod
      description: The mod's id (owner/repo) or its GitHub link.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What's wrong?
    validations:
      required: true
